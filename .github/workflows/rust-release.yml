name: rust-release

on:
  push:
    branches:
      - fork-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize allocation and publication; repeated runs reuse the commit's tag.
  group: rust-release-fork-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/fork-release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      fork_commit: ${{ steps.release.outputs.fork_commit }}
      upstream_commit: ${{ steps.release.outputs.upstream_commit }}
      version: ${{ steps.release.outputs.version }}
      rust_toolchain: ${{ steps.release.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream release and allocate the fork tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fork_release.py resolve --github-output "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    name: Build codex - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Install Zig for musl native dependencies
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Prepare musl toolchain
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-musl-build-tools.sh
      - name: Download and verify the upstream package; stamp the fork version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        run: |
          python .github/scripts/fork_release.py prepare \
            --tag "$RELEASE_TAG" --upstream-commit "$UPSTREAM_COMMIT" \
            --target "$TARGET" --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --env-file "$GITHUB_ENV"
      - name: Build only the Codex entrypoint
        working-directory: codex-rs
        run: |
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          if [[ "$TARGET" == *-linux-musl ]]; then
            export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          fi
          cargo build --locked --release -p codex-cli --bin codex --target "$TARGET"
      - name: Strip the fork executable
        if: runner.os != 'Windows'
        run: |
          binary="codex-rs/target/$TARGET/release/codex"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            strip -S -x "$binary"
            codesign --force --sign - "$binary"
          else
            strip --strip-debug --strip-unneeded "$binary"
          fi
      - name: Assemble the package with unchanged upstream helpers
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python .github/scripts/fork_release.py assemble \
            --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --binary "codex-rs/target/$TARGET/release/codex$suffix" --output-dir dist
      - name: Check the packaged CLI and voice helper identities
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          actual="$("upstream-package/bin/codex$suffix" --version)"
          [[ "$actual" == "codex-cli $FORK_VERSION" ]]
          voice_commit="$("upstream-package/codex-resources/voice/bin/codex-voice-host$suffix" --build-commit)"
          [[ "$voice_commit" == "$CODEX_VOICE_HELPER_COMMIT" ]]
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.target }}
          path: dist/codex-package-*.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: codex-*
          merge-multiple: true
      - name: Publish the stable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 .github/scripts/fork_release.py publish --tag "$RELEASE_TAG" --directory dist
