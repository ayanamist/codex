name: rust-release

on:
  push:
    branches:
      - fork-release
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.mmd'
  workflow_dispatch:
    inputs:
      verify_compiler_cache:
        description: "Benchmark compiler caching with two builds; do not allocate a tag or publish a release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize allocation and publication; repeated runs reuse the commit's tag.
  group: rust-release-fork-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/fork-release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_build: ${{ steps.release.outputs.should_build }}
      fork_commit: ${{ steps.release.outputs.fork_commit }}
      upstream_commit: ${{ steps.release.outputs.upstream_commit }}
      version: ${{ steps.release.outputs.version }}
      rust_toolchain: ${{ steps.release.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream release and fork build identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_compiler_cache }}
        run: |
          args=()
          if [[ "$BENCHMARK_ONLY" == "true" ]]; then args+=(--benchmark-only); fi
          python3 .github/scripts/fork_release.py resolve --github-output "$GITHUB_OUTPUT" "${args[@]}"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    name: Build codex - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: fork-release-v1
      # Keep native compiler inputs visible when the dependency cache is keyed.
      LIBSQLITE3_FLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Jammy's glibc 2.35 keeps new CLI imports below the 2.38 ceiling.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Configure short Cargo paths and Git long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Keep paths short for remaining git dependencies and older reruns.
          $cargoHome = Join-Path ([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'c'
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master: explicit toolchain input
        with:
          toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils pkg-config libcap-dev libssl-dev
      - name: Prepare pinned V8 Rust sources without native submodules
        run: python .github/scripts/prepare_rusty_v8_source.py
      - name: Adapt application version reads in the build checkout
        run: |
          python .github/scripts/prepare_fork_sources.py \
            --report build-metrics/fork-source-preparation.json
      - name: Fingerprint release build settings without the package version
        id: build_settings
        run: python .github/scripts/fork_release.py cache-key --github-output "$GITHUB_OUTPUT"
      # Internal package identities stay 0.0.0. sccache retains workspace library
      # compilations; the Cargo artifact cache keeps third-party dependencies.
      - name: Cache Cargo dependencies and compiled third-party crates
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: fork-release-v2
          # Keep profiles/patches isolated while allowing fallback across version
          # and dependency updates. rust-cache fingerprints dependencies itself.
          key: ${{ matrix.runner }}-${{ matrix.target }}-${{ steps.build_settings.outputs.build_settings_hash }}
          env-vars: LIBSQLITE3_FLAGS
          workspaces: codex-rs -> target
          cache-bin: "false"
          cache-workspace-crates: "false"
      - name: Download and verify the upstream package; export executable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        run: |
          python .github/scripts/fork_release.py prepare \
            --tag "$RELEASE_TAG" --upstream-commit "$UPSTREAM_COMMIT" \
            --target "$TARGET" --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --env-file "$GITHUB_ENV"
      - name: Set up the pinned Rust compiler cache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.19.0"
      - name: Build the Codex CLI and standalone executor
        id: compile
        working-directory: codex-rs
        env:
          RUSTC_WRAPPER: sccache
        run: |
          sccache --zero-stats
          cargo build --locked --release --timings \
            -p codex-cli -p codex-exec-server-cli \
            --bin codex --bin codex-exec-server --target "$TARGET"
      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success' && steps.compile.outcome != 'skipped'
        working-directory: codex-rs
        run: |
          mkdir -p target
          sccache --show-stats
          sccache --show-stats --stats-format json > target/sccache-initial.json
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-build-timings-${{ matrix.target }}
          path: |
            codex-rs/target/cargo-timings/*.html
            codex-rs/target/sccache-initial.json
            build-metrics/fork-source-preparation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Measure compiler cache reuse without Cargo build artifacts
        id: warm_compile
        if: github.event_name == 'workflow_dispatch' && inputs.verify_compiler_cache
        working-directory: codex-rs
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo clean --release --target "$TARGET"
          sccache --zero-stats
          cargo build --locked --release --timings \
            -p codex-cli -p codex-exec-server-cli \
            --bin codex --bin codex-exec-server --target "$TARGET"
      - name: Record warm compiler cache statistics
        if: always() && steps.warm_compile.outcome != 'skipped' && steps.sccache.outcome == 'success'
        working-directory: codex-rs
        run: |
          mkdir -p target
          sccache --show-stats
          sccache --show-stats --stats-format json > target/sccache-warm.json
      - name: Upload warm build timings and compiler cache statistics
        if: always() && steps.warm_compile.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-warm-build-timings-${{ matrix.target }}
          path: |
            codex-rs/target/cargo-timings/*.html
            codex-rs/target/sccache-warm.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Strip and sign the fork executables
        if: runner.os != 'Windows'
        run: |
          for name in codex codex-exec-server; do
            binary="codex-rs/target/$TARGET/release/$name"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              strip -S -x "$binary"
              codesign --force --sign - "$binary"
            else
              strip --strip-debug --strip-unneeded "$binary"
            fi
          done
      - name: Assemble the package with the fork CLI and executor
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python .github/scripts/fork_release.py assemble \
            --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --binary "codex-rs/target/$TARGET/release/codex$suffix" \
            --exec-server-binary "codex-rs/target/$TARGET/release/codex-exec-server$suffix" \
            --output-dir dist
      - name: Check the packaged CLI, executor, and voice helper identities
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          actual="$("upstream-package/bin/codex$suffix" --version)"
          [[ "$actual" == "codex-cli $FORK_VERSION" ]]
          executor_version="$("upstream-package/bin/codex-exec-server$suffix" --version)"
          [[ "$executor_version" == "codex-exec-server $FORK_VERSION" ]]
          voice_commit="$("upstream-package/codex-resources/voice/bin/codex-voice-host$suffix" --build-commit)"
          [[ "$voice_commit" == "$CODEX_VOICE_HELPER_COMMIT" ]]
      - name: Check all packaged ELF imports against glibc 2.38
        if: runner.os == 'Linux'
        run: python .github/scripts/check_linux_glibc.py upstream-package
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.target }}
          path: dist/codex-package-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: codex-*
          merge-multiple: true
      - name: Publish the stable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 .github/scripts/fork_release.py publish --tag "$RELEASE_TAG" --directory dist
