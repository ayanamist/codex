name: rust-release-windows

on:
  push:
    branches:
      - fork-release
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.mmd'
      - '.github/workflows/rust-release-linux.yml'
      - '.github/workflows/rust-release-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize allocation and upload per platform; repeated runs reuse the commit's tag.
  group: rust-release-x86_64-pc-windows-msvc-fork-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/fork-release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_build: ${{ steps.release.outputs.should_build }}
      fork_commit: ${{ steps.release.outputs.fork_commit }}
      upstream_commit: ${{ steps.release.outputs.upstream_commit }}
      version: ${{ steps.release.outputs.version }}
      rust_toolchain: ${{ steps.release.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream release and fork build identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--ignored-path .github/workflows/rust-release-linux.yml --ignored-path .github/workflows/rust-release-macos.yml)
          python3 .github/scripts/fork_release.py resolve --github-output "$GITHUB_OUTPUT" "${args[@]}"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    name: Build codex - x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Keep native compiler inputs visible when the dependency cache is keyed.
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Configure short Cargo paths and Git long paths on Windows
        shell: pwsh
        run: |
          # Keep paths short for remaining git dependencies and older reruns.
          $cargoHome = Join-Path ([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'c'
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master: explicit toolchain input
        with:
          toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
          targets: x86_64-pc-windows-msvc
      - name: Configure MSVC
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Prepare pinned V8 Rust sources without native submodules
        run: python .github/scripts/prepare_rusty_v8_source.py
      - name: Adapt application version reads in the build checkout
        run: |
          python -X utf8 .github/scripts/prepare_fork_sources.py \
            --report build-metrics/fork-source-preparation.json
      - name: Fingerprint release build settings without the package version
        id: build_settings
        run: python .github/scripts/fork_release.py cache-key --github-output "$GITHUB_OUTPUT"
      # Internal package identities stay 0.0.0; the Cargo artifact cache keeps third-party dependencies.
      - name: Cache Cargo dependencies and compiled third-party crates
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: fork-release-v2
          # Keep profiles/patches isolated while allowing fallback across version
          # and dependency updates. rust-cache fingerprints dependencies itself.
          key: windows-2025-x86_64-pc-windows-msvc-${{ steps.build_settings.outputs.build_settings_hash }}
          env-vars: LIBSQLITE3_FLAGS
          workspaces: codex-rs -> target
          cache-bin: "false"
          cache-workspace-crates: "false"
      - name: Download and verify the upstream package; export executable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        run: |
          python .github/scripts/fork_release.py prepare \
            --tag "$RELEASE_TAG" --upstream-commit "$UPSTREAM_COMMIT" \
            --target "$TARGET" --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --env-file "$GITHUB_ENV"
      - name: Build the Codex CLI and standalone executor
        id: compile
        working-directory: codex-rs
        run: |
          cargo build --locked --release --timings \
            -p codex-cli -p codex-exec-server-cli \
            --bin codex --bin codex-exec-server --target "$TARGET"
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-build-timings-x86_64-pc-windows-msvc
          path: |
            codex-rs/target/cargo-timings/*.html
            build-metrics/fork-source-preparation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble the package with the fork CLI and executor
        run: |
          suffix=".exe"
          python .github/scripts/fork_release.py assemble \
            --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --binary "codex-rs/target/$TARGET/release/codex$suffix" \
            --exec-server-binary "codex-rs/target/$TARGET/release/codex-exec-server$suffix" \
            --output-dir dist
      - name: Check the packaged CLI, executor, and voice helper identities
        run: |
          suffix=".exe"
          actual="$("upstream-package/bin/codex$suffix" --version)"
          [[ "$actual" == "codex-cli $FORK_VERSION" ]]
          executor_version="$("upstream-package/bin/codex-exec-server$suffix" --version)"
          [[ "$executor_version" == "codex-exec-server $FORK_VERSION" ]]
          voice_commit="$("upstream-package/codex-resources/voice/bin/codex-voice-host$suffix" --build-commit)"
          [[ "$voice_commit" == "$CODEX_VOICE_HELPER_COMMIT" ]]
      - name: Add this platform's package to the release
        if: needs.resolve.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python .github/scripts/fork_release.py publish --tag "$RELEASE_TAG" --directory dist
