name: rust-release-macos

on:
  push:
    branches:
      - fork-release
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.mmd'
      - '.github/workflows/rust-release-linux.yml'
      - '.github/workflows/rust-release-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize allocation and upload per platform; repeated runs reuse the commit's tag.
  group: rust-release-aarch64-apple-darwin-fork-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/fork-release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_build: ${{ steps.release.outputs.should_build }}
      fork_commit: ${{ steps.release.outputs.fork_commit }}
      upstream_commit: ${{ steps.release.outputs.upstream_commit }}
      version: ${{ steps.release.outputs.version }}
      rust_toolchain: ${{ steps.release.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the upstream release and fork build identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--ignored-path .github/workflows/rust-release-linux.yml --ignored-path .github/workflows/rust-release-windows.yml)
          python3 .github/scripts/fork_release.py resolve --github-output "$GITHUB_OUTPUT" "${args[@]}"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    name: Build ${{ matrix.binary }} - aarch64-apple-darwin
    runs-on: macos-15
    # Run 43135737205 exceeded three hours; allow cold builds and cache saving.
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: codex
            package: codex-cli
          - binary: codex-exec-server
            package: codex-exec-server-cli
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Keep native compiler inputs visible when the dependency cache is keyed.
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master: explicit toolchain input
        with:
          toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
          targets: aarch64-apple-darwin
      - name: Prepare pinned V8 Rust sources without native submodules
        run: python .github/scripts/prepare_rusty_v8_source.py
      - name: Adapt application version reads in the build checkout
        run: |
          python -X utf8 .github/scripts/prepare_fork_sources.py \
            --report build-metrics/fork-source-preparation.json
      - name: Fingerprint release build settings without the package version
        id: build_settings
        run: python .github/scripts/fork_release.py cache-key --github-output "$GITHUB_OUTPUT"
      # Internal package identities stay 0.0.0; the Cargo artifact cache keeps third-party dependencies.
      - name: Cache Cargo dependencies and compiled third-party crates
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: fork-release-v2
          # Keep profiles/patches isolated while allowing fallback across version
          # and dependency updates. rust-cache fingerprints dependencies itself.
          # shared-key omits the per-job suffix so both matrix jobs use one cache.
          shared-key: macos-15-aarch64-apple-darwin-${{ steps.build_settings.outputs.build_settings_hash }}
          workspaces: codex-rs -> target
          cache-bin: "false"
          cache-workspace-crates: "false"
          # codex-cli's dependencies are a superset of the executor's, so only it saves.
          save-if: ${{ matrix.binary == 'codex' }}
      - name: Download and verify the upstream package; export executable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        run: |
          python .github/scripts/fork_release.py prepare \
            --tag "$RELEASE_TAG" --upstream-commit "$UPSTREAM_COMMIT" \
            --target "$TARGET" --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --env-file "$GITHUB_ENV"
      - name: Build the fork executable
        working-directory: codex-rs
        run: |
          cargo build --locked --release --timings \
            -p ${{ matrix.package }} --bin ${{ matrix.binary }} --target "$TARGET"
      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-build-timings-${{ matrix.binary }}-aarch64-apple-darwin
          path: |
            codex-rs/target/cargo-timings/*.html
            build-metrics/fork-source-preparation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Strip and sign the fork executable
        run: |
          binary="codex-rs/target/$TARGET/release/${{ matrix.binary }}"
          strip -S -x "$binary"
          codesign --force --sign - "$binary"
      - name: Upload the fork executable
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fork-binary-${{ matrix.binary }}
          path: codex-rs/target/aarch64-apple-darwin/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    name: Package codex - aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.fork_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fork-binary-*
          merge-multiple: true
          path: fork-binaries
      - name: Download and verify the upstream package; export executable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        run: |
          python .github/scripts/fork_release.py prepare \
            --tag "$RELEASE_TAG" --upstream-commit "$UPSTREAM_COMMIT" \
            --target "$TARGET" --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --env-file "$GITHUB_ENV"
      - name: Assemble the package with the fork CLI and executor
        run: |
          python .github/scripts/fork_release.py assemble \
            --package-dir "$GITHUB_WORKSPACE/upstream-package" \
            --binary fork-binaries/codex \
            --exec-server-binary fork-binaries/codex-exec-server \
            --output-dir dist
      - name: Check the packaged CLI, executor, and voice helper identities
        run: |
          actual="$("upstream-package/bin/codex" --version)"
          [[ "$actual" == "codex-cli $FORK_VERSION" ]]
          executor_version="$("upstream-package/bin/codex-exec-server" --version)"
          [[ "$executor_version" == "codex-exec-server $FORK_VERSION" ]]
          voice_commit="$("upstream-package/codex-resources/voice/bin/codex-voice-host" --build-commit)"
          [[ "$voice_commit" == "$CODEX_VOICE_HELPER_COMMIT" ]]
      - name: Add this platform's package to the release
        if: needs.resolve.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python .github/scripts/fork_release.py publish --tag "$RELEASE_TAG" --directory dist
